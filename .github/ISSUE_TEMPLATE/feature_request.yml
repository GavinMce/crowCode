name: Feature request
description: Propose a new feature or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: false
  - type: input
    id: component
    attributes:
      label: Affected package/app
      placeholder: e.g. apps/electron, packages/sandbox
    validations:
      required: false
