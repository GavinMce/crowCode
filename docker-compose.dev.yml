services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: crowcode
      MINIO_ROOT_PASSWORD: crowcode-dev-secret
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 crowcode crowcode-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/crowcode-dev;
      "

  agent-runtime-base:
    build:
      context: .
      dockerfile: apps/agent-runtime/Dockerfile
    image: crowcode/agent-runtime-base:1
    profiles:
      - build-only

volumes:
  minio-data:
